<text x="36" y="558" font-size="18" fill="#94b9ff">Banqueta: apenas bordas realmente expostas no plano de corrida.</text>
<text x="36" y="589" font-size="18">Não unir topos por uma linha reta; não achatar a cabeça para caber num colisor.</text>
<text x="36" y="620" font-size="16" fill="#bdc8db">Integração futura: medir contorno/apoio real, inclinação e regiões; testar pés em câmera final.</text>
