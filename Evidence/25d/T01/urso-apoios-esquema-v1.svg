<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Urso: intenção dos apoios, esquema conceitual separado</title>
<desc id="desc">Coroa curva da cabeça como apoio principal, orelhas com regiões próprias e bordas inferiores da banqueta somente onde expostas. Este desenho não mede a imagem nem valida colliders.</desc>
